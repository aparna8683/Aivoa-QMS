services:
  db:
    image: postgres:16-alpine
    container_name: aivoa-qms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aivoa_qms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aivoa_pgdata:/var/lib/postgresql/data

volumes:
  aivoa_pgdata:
